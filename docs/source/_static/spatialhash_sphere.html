<script>
(function(){
  var SPH = {
    1: "searchsorted(cell_pix, 1) = 0  \u2192  bounds [0, 3)  \u2192  read red[0:3], contiguous",
    3: "searchsorted(cell_pix, 3) = 1  \u2192  bounds [3, 4)  \u2192  read red[3:4], contiguous",
    4: "searchsorted(cell_pix, 4) = 2  \u2192  bounds [4, 6)  \u2192  read red[4:6], contiguous",
    _empty: "searchsorted(cell_pix, {p}) lands on a different id  \u2192  cell absent, skip"
  };
  function wire(svgId, outId, table, hint){
    var svg = document.getElementById(svgId);
    var out = document.getElementById(outId);
    if(!svg || !out) return;
    var nodes = svg.querySelectorAll("[data-p]");
    function set(p){
      for(var i=0;i<nodes.length;i++){
        var list = nodes[i].getAttribute("data-p").split(/\s+/);
        nodes[i].classList.toggle("on", p !== null && list.indexOf(p) !== -1);
      }
      if(p === null){ out.textContent = hint; return; }
      out.textContent = "pixel " + p + ":  " +
        (table[p] || table._empty.replace("{p}", p));
    }
    for(var j=0;j<nodes.length;j++){
      (function(el){
        var p = el.getAttribute("data-p").split(/\s+/)[0];
        el.addEventListener("mouseenter", function(){ set(p); });
        el.addEventListener("focus", function(){ set(p); });
        el.addEventListener("click", function(){ set(p); });
      })(nodes[j]);
    }
    svg.addEventListener("mouseleave", function(){ set("1"); });
    set("1");
  }
  wire("oh-sph", "oh-sph-out", SPH, "hover a pixel");
})();
</script>
