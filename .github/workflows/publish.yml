name: Build and Publish Wheels

# Trigger on tags like v0.1.0 and allow manual runs
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag or SHA) to run on. Leave empty for default branch.'
        required: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # one red platform should not hide the result of the others
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm,
             macos-14, macos-15, macos-15-intel, macos-26, macos-26-intel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref || github.sha }}

      # Optional: set up a Python on the runner (not required for cibuildwheel, but fine)
      - name: Set up Python (runner)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip && pip install cibuildwheel

      - name: Build wheels
        env:
          # build valid cp3xx wheels
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          # HEALPix is vendored, so only clang's OpenMP runtime is still external
          CIBW_BEFORE_ALL_MACOS: brew install libomp
        run: |
          # The deployment target must not be older than the brew libomp that
          # delocate bundles, so pin it to the runner's own macOS version.
          if [ "$(uname -s)" = "Darwin" ]; then
            export MACOSX_DEPLOYMENT_TARGET="$(sw_vers -productVersion | cut -d. -f1).0"
            echo "Setting MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          fi
          cibuildwheel --output-dir wheelhouse

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-${{ matrix.os }}
          path: wheelhouse/*.whl

      # A wheel that imports fine can still die the moment a kernel spawns worker
      # threads, because healpy, scikit-learn and orpheus each vendor a libomp copy
      # on macOS. Run one real parallel correlation to catch that before publishing.
      - name: Smoke test the wheel with OpenMP workers
        if: runner.os == 'macOS'
        run: |
          whl=$(ls "$PWD"/wheelhouse/*cp311*.whl 2>/dev/null | head -1)
          if [ -z "$whl" ]; then echo "no cp311 wheel found in wheelhouse"; exit 1; fi
          python -m venv "$RUNNER_TEMP/smoke_env"
          "$RUNNER_TEMP/smoke_env/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/smoke_env/bin/pip" install --quiet "$whl" scikit-learn
          # Away from the checkout, so that the source tree cannot shadow the wheel
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke_env/bin/python" -u - <<'PY'
          import ctypes as ct
          import os
          import warnings
          import numpy as np

          # Import order of a typical session: the vendored runtimes land first
          import healpy
          import sklearn.decomposition
          warnings.simplefilter("always")
          import orpheus
          assert "site-packages" in orpheus.__file__, orpheus.__file__

          dyld = ct.CDLL(None)
          dyld._dyld_get_image_name.restype = ct.c_char_p
          images = [dyld._dyld_get_image_name(i).decode() for i in range(dyld._dyld_image_count())]
          runtimes = [p for p in images if os.path.basename(p).startswith(("libomp", "libiomp", "libgomp"))]
          print("OpenMP runtimes loaded: %d"%len(runtimes))
          for p in runtimes:
              print("   ", p)

          rng = np.random.default_rng(42)
          ngal = 20000
          cat = orpheus.SpinTracerCatalog(spin=2,
                                          pos1=rng.uniform(0., 600., ngal),
                                          pos2=rng.uniform(0., 600., ngal),
                                          tracer_1=rng.normal(0., 0.3, ngal),
                                          tracer_2=rng.normal(0., 0.3, ngal))
          # Serial first: if that already dies the fault is in the kernel rather than
          # in the OpenMP runtimes fighting over the worker threads
          for nthreads in (1, 4):
              twopcf = orpheus.GGCorrelation(min_sep=1., max_sep=100., binsize=0.2, nthreads=nthreads)
              twopcf.process(cat)
              assert np.isfinite(twopcf.xip).any(), "xip is all non-finite"
              print("nthreads=%d ok, xip[:3] ="%nthreads, np.asarray(twopcf.xip).ravel()[:3])
          PY

  # The wheel above bundles its own libomp; this job covers the other half, the
  # conda-forge source build the installation docs recommend. Homebrew's libomp is
  # installed on purpose so that the conda prefix has to win the search in setup.py.
  conda_source_build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref || github.sha }}

      - name: Install a competing libomp
        run: brew install libomp

      - name: Set up a conda-forge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: orpheus_omp
          python-version: "3.12"

      - name: Build orpheus from source against the conda libomp
        shell: bash -el {0}
        run: |
          conda install -y astropy healpy "numba<=0.62.1" numpy scipy scikit-learn llvm-openmp
          pip install .

      - name: Require a single OpenMP runtime, then run a parallel kernel
        shell: bash -el {0}
        run: |
          # Away from the checkout, so that the source tree cannot shadow the install
          cd "$RUNNER_TEMP"
          python -u - <<'PY'
          import ctypes as ct
          import os
          import numpy as np

          import healpy
          import sklearn.decomposition
          import orpheus
          assert "site-packages" in orpheus.__file__, orpheus.__file__

          dyld = ct.CDLL(None)
          dyld._dyld_get_image_name.restype = ct.c_char_p
          images = [dyld._dyld_get_image_name(i).decode() for i in range(dyld._dyld_image_count())]
          runtimes = [p for p in images if os.path.basename(p).startswith(("libomp", "libiomp", "libgomp"))]
          for p in runtimes:
              print("   ", p)
          assert len(runtimes) == 1, "expected one OpenMP runtime, found %d"%len(runtimes)

          rng = np.random.default_rng(42)
          ngal = 20000
          cat = orpheus.SpinTracerCatalog(spin=2,
                                          pos1=rng.uniform(0., 600., ngal),
                                          pos2=rng.uniform(0., 600., ngal),
                                          tracer_1=rng.normal(0., 0.3, ngal),
                                          tracer_2=rng.normal(0., 0.3, ngal))
          twopcf = orpheus.GGCorrelation(min_sep=1., max_sep=100., binsize=0.2, nthreads=4)
          twopcf.process(cat)
          assert np.isfinite(twopcf.xip).any(), "xip is all non-finite"
          print("xip[:3] =", np.asarray(twopcf.xip).ravel()[:3])
          PY

  sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: python -m pip install --upgrade pip build && python -m build --sdist --outdir wheelhouse

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-sdist
          path: wheelhouse/*.tar.gz

  publish:
    needs: [build, sdist]
    # workflow_dispatch is then a build-only dry run
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # One pattern rather than one step per runner, so the matrix can grow freely
      - name: Download every wheelhouse and the sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheelhouse-*
          path: wheelhouse

      - name: List wheels (before)
        run: ls -R wheelhouse || true

      - name: Gather wheels into a single directory
        run: |
          mkdir -p wheelhouse_all
          # copy any .whl or .tar.gz from the downloaded artifact dirs
          find wheelhouse -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp -v {} wheelhouse_all/ \;
          echo "Contents of wheelhouse_all:"
          ls -la wheelhouse_all || true

      - name: Set up Python for publishing
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install twine
        run: python -m pip install --upgrade pip setuptools wheel twine

      - name: Publish to PyPI with twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload wheelhouse_all/* --non-interactive --skip-existing

