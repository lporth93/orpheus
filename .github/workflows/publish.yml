name: Build and Publish Wheels

# Trigger on tags like v0.1.0 and allow manual runs
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag or SHA) to run on. Leave empty for default branch.'
        required: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Only linux and macos, no windows
        os: [ubuntu-latest, macos-14, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref || github.sha }}

      # Optional: set up a Python on the runner (not required for cibuildwheel, but fine)
      - name: Set up Python (runner)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip && pip install cibuildwheel

      - name: Build wheels
        env:
          # build valid cp3xx wheels
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp*"
          # The manylinux container has no apt and no healpix_cxx, so build it
          # and its cfitsio dependency from source once per container.
          CIBW_BEFORE_ALL_LINUX: >
            cd /tmp &&
            curl -sSL https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/cfitsio-4.5.0.tar.gz | tar xz &&
            cd cfitsio-4.5.0 && ./configure --prefix=/usr/local && make -j4 && make install && cd .. &&
            curl -sSL -o healpix_cxx.tar.gz "https://sourceforge.net/projects/healpix/files/Healpix_3.83/healpix_cxx-3.83.0.tar.gz/download" &&
            tar xzf healpix_cxx.tar.gz && cd healpix_cxx-3.83.0 &&
            PKG_CONFIG_PATH=/usr/local/lib/pkgconfig ./configure --prefix=/usr/local &&
            make -j4 && make install && cd .. &&
            echo /usr/local/lib > /etc/ld.so.conf.d/healpix_cxx.conf && ldconfig
          # LD_LIBRARY_PATH lets auditwheel vendor libhealpix_cxx.so into the wheel.
          CIBW_ENVIRONMENT_LINUX: >
            HEALPIX_CXX_DIR=/usr/local
            PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            LD_LIBRARY_PATH=/usr/local/lib
          # macOS wheels build natively on the runner, so homebrew suffices.
          CIBW_BEFORE_ALL_MACOS: brew install healpix
          CIBW_ENVIRONMENT_MACOS: HEALPIX_CXX_DIR=/opt/homebrew
        run: |
          # For macOS builds set deployment target to match libgomp dependency seen earlier
          if [ "$(uname -s)" = "Darwin" ]; then
            mac_ver=$(sw_vers -productVersion | cut -d. -f1)
            echo "Detected macOS version: $mac_ver"
            if [[ "$mac_ver" == "14" ]]; then
              export MACOSX_DEPLOYMENT_TARGET=14.0
              echo "Setting MACOSX_DEPLOYMENT_TARGET=14.0"
            else
              export MACOSX_DEPLOYMENT_TARGET=15.0
              echo "Setting MACOSX_DEPLOYMENT_TARGET=15.0 (default)"
            fi
          fi
          cibuildwheel --output-dir wheelhouse

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: python -m pip install --upgrade pip build && python -m build --sdist --outdir wheelhouse

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-sdist
          path: wheelhouse/*.tar.gz

  publish:
    needs: [build, sdist]
    # workflow_dispatch is then a build-only dry run
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-ubuntu-latest
          path: wheelhouse/ubuntu

      - name: Download macOS 14 wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-macos-14
          path: wheelhouse/macos/14

      - name: Download macOS latest wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-macos-latest
          path: wheelhouse/macos/latest

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-sdist
          path: wheelhouse/sdist

      - name: List wheels (before)
        run: ls -R wheelhouse || true

      - name: Gather wheels into a single directory
        run: |
          mkdir -p wheelhouse_all
          # copy any .whl or .tar.gz from the downloaded artifact dirs
          find wheelhouse -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp -v {} wheelhouse_all/ \;
          echo "Contents of wheelhouse_all:"
          ls -la wheelhouse_all || true

      - name: Set up Python for publishing
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install twine
        run: python -m pip install --upgrade pip setuptools wheel twine

      - name: Publish to PyPI with twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload wheelhouse_all/* --non-interactive --skip-existing

