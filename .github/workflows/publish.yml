name: Build and Publish Wheels

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python (runner)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip && pip install cibuildwheel

      - name: Build wheels
        env:
          # include cp312 and any other CPython versions you want to build
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp*"
        run: |
          # On macOS runners set MACOSX_DEPLOYMENT_TARGET to match bundled libgomp
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "Setting MACOSX_DEPLOYMENT_TARGET=15.0 for macOS build"
            export MACOSX_DEPLOYMENT_TARGET=15.0
          fi
          cibuildwheel --output-dir wheelhouse

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-ubuntu-latest
          path: wheelhouse/ubuntu

      - name: Download macOS wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-macos-latest
          path: wheelhouse/macos

      - name: Download Windows wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-windows-latest
          path: wheelhouse/windows

      - name: List wheels
        run: ls -R wheelhouse

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.6.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          user: __token__
          packages_dir: wheelhouse
