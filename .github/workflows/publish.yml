name: Build and Publish Wheels

# Trigger on tags like v0.1.0 and allow manual runs
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag or SHA) to run on. Leave empty for default branch.'
        required: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Only linux and macos, no windows
        os: [ubuntu-latest, macos-14, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref || github.sha }}

      # Optional: set up a Python on the runner (not required for cibuildwheel, but fine)
      - name: Set up Python (runner)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip && pip install cibuildwheel

      - name: Build wheels
        env:
          # build cp39..cp312 wheels (adjust as needed)
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp*"
        run: |
          # For macOS builds set deployment target to match libgomp dependency seen earlier
          if [ "$(uname -s)" = "Darwin" ]; then
            mac_ver=$(sw_vers -productVersion | cut -d. -f1)
            echo "Detected macOS version: $mac_ver"
            if [[ "$mac_ver" == "14" ]]; then
              export MACOSX_DEPLOYMENT_TARGET=14.0
              echo "Setting MACOSX_DEPLOYMENT_TARGET=14.0"
            else
              export MACOSX_DEPLOYMENT_TARGET=15.0
              echo "Setting MACOSX_DEPLOYMENT_TARGET=15.0 (default)"
            fi
          fi
          cibuildwheel --output-dir wheelhouse

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-ubuntu-latest
          path: wheelhouse/ubuntu

      - name: Download macOS 14 wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-macos-14
          path: wheelhouse/macos/14

      - name: Download macOS latest wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-macos-latest
          path: wheelhouse/macos/latest

      - name: List wheels (before)
        run: ls -R wheelhouse || true

      - name: Gather wheels into a single directory
        run: |
          mkdir -p wheelhouse_all
          # move/copy any .whl or .tar.gz from the downloaded artifact dirs
          shopt -s globstar || true
          for f in wheelhouse/**/**/*.whl wheelhouse/**/*.whl wheelhouse/*.whl; do
            if [ -f "$f" ]; then
              cp -v "$f" wheelhouse_all/ || true
            fi
          done
          echo "Contents of wheelhouse_all:"
          ls -la wheelhouse_all || true

      - name: Set up Python for publishing
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install twine
        run: python -m pip install --upgrade pip setuptools wheel twine

      - name: Publish to PyPI with twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload wheelhouse_all/* --non-interactive

