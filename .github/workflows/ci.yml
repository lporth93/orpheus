name: CI

# The release workflow only runs on tags, so this is what checks a commit before
# it lands. It builds the C extension and exercises one parallel kernel; the full
# test suite is not part of the repository yet.
on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Continue the job even if one platform fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        # 3.10 is the floor declared in python_requires, so it gets checked too
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linux gets OpenMP from gcc; Apple clang needs libomp separately
      - name: Install libomp
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Import and run a parallel kernel
        run: |
          # Away from the checkout: the C library is looked up next to the imported
          # package, so a source tree on sys.path shadows the install
          cd "$RUNNER_TEMP"
          python -u - <<'PY'
          import numpy as np
          import orpheus

          print("orpheus", orpheus.__version__, "from", orpheus.__file__)

          rng = np.random.default_rng(42)
          ngal = 20000
          cat = orpheus.SpinTracerCatalog(spin=2,
                                          pos1=rng.uniform(0., 600., ngal),
                                          pos2=rng.uniform(0., 600., ngal),
                                          tracer_1=rng.normal(0., 0.3, ngal),
                                          tracer_2=rng.normal(0., 0.3, ngal))
          twopcf = orpheus.GGCorrelation(min_sep=1., max_sep=100., binsize=0.2, nthreads=2)
          twopcf.process(cat)
          assert np.isfinite(twopcf.xip).any(), "xip is all non-finite"
          print("xip[:3] =", np.asarray(twopcf.xip).ravel()[:3])
          PY
