name: CI

# This builds the package and then runs the fast-tier test suite.
on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Continue the job even if one platform fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        # 3.10 is the floor declared in python_requires, so it gets checked too
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linux gets OpenMP from gcc; Apple clang needs libomp separately
      - name: Install libomp
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov mpmath
          pip install .

      - name: Run the fast tier
        run: |
          # Report the installed package from outside the checkout: `python -c` puts the
          # working directory first on sys.path, so run from here it would report the
          # source tree instead of the wheel that was just built.
          (cd "$RUNNER_TEMP" && python -c "import orpheus; print('orpheus', orpheus.__version__, 'from', orpheus.__file__)")
          # The pytest run itself is safe from the same shadowing: `tests/conftest.py`
          # drops the checkout from sys.path when it carries no compiled extension.
          pytest tests/ -q --cov=orpheus --cov-report=term
